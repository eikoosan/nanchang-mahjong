<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e423b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="南昌算子"><link rel="manifest" href="manifest.webmanifest"><title>南昌麻将算子</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#183a31;background:#f3f6f2}*{box-sizing:border-box}body{margin:0}header{background:#0e423b;color:white;padding:calc(21px + env(safe-area-inset-top)) 18px 20px}header>div{max-width:700px;margin:auto}h1{font-size:24px;margin:0}header p{font-size:13px;color:#b8d6ca;margin:5px 0 0}.wrap{max-width:700px;margin:auto;padding:15px 12px 60px}.card{background:white;border:1px solid #dce8de;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 3px 12px #12362a09}h2{font-size:18px;margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.question{margin:0 0 17px;padding:0;border:0;min-width:0}.question:last-child{margin-bottom:0}.question legend,.question-title{font-size:15px;font-weight:700;margin-bottom:9px;padding:0}.choice{position:relative;cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #cbdad0;border-radius:10px;background:#f7faf7;font-size:15px;font-weight:600;white-space:nowrap}.choice input:checked+span{background:#0e684e;border-color:#0e684e;color:white}.choice input:focus-visible+span{outline:3px solid #80bfa0;outline-offset:2px}.question select{width:100%;height:46px;border:1px solid #cbdad0;background:white;border-radius:10px;padding:8px 10px;color:#17342f;font-size:16px}.modifiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.modifier{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 2px;border:1px solid #cbdad0;border-radius:8px;background:#f7faf7;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer}.modifier[hidden],.modifiers[hidden],#pattern[hidden],#specialPattern[hidden]{display:none}.choice input:disabled+span{opacity:.35;cursor:not-allowed}.modifier input{accent-color:#0e684e;width:15px;height:15px;flex:none}.question[hidden]{display:none}.playergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player{border:1px solid #d8e7db;border-radius:12px;padding:10px;text-align:center}.player input.name{width:100%;border:0;text-align:center;font-size:15px;font-weight:650;color:#183a31;background:transparent;outline:none}.player input.points{margin:10px auto 2px;width:100%;max-width:90px;min-height:46px;border:1px solid #bbd3c3;border-radius:9px;text-align:center;font-size:20px;font-weight:700;color:#11684b;background:#f7fbf7}.muted{font-size:12px;color:#6e8175;line-height:1.55}.score{font-size:20px;font-weight:800;color:#11694b}.negative{color:#b34834}.result{padding:12px;background:#ecf7ef;border-radius:12px;margin-bottom:12px}.breakdown{border:1px solid #d8e8dc;border-radius:10px;margin:0 0 13px;overflow:hidden}.breakdown summary{cursor:pointer;padding:12px 14px;font-size:14px;font-weight:650;color:#0e684e;list-style:none}.breakdown summary::-webkit-details-marker{display:none}.breakdown summary::after{content:"⌄";float:right}.breakdown[open] summary::after{content:"⌃"}.breakdown #details{padding:0 13px 4px}.detail{border-top:1px solid #dae9de;padding:10px 2px;font-size:14px;display:flex;justify-content:space-between;gap:10px}.detail:first-child{border:0}.warn{background:#fff4e4;color:#815124;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}button{font:inherit;cursor:pointer}.primary{width:100%;background:#0e684e;color:white;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700}.small{padding:9px 12px;color:#0e684e;background:white;border:1px solid #c8d9ce;border-radius:9px}footer{font-size:12px;color:#798a7f;text-align:center;padding:4px 0 18px}@media(max-width:530px){.playergrid{grid-template-columns:repeat(2,1fr)}.card{padding:14px}}
</style></head><body><header><div><h1>🀄 南昌麻将算子</h1><p>只算当局 · 四家一眼看清</p></div></header><main class="wrap"><section class="card"><h2>本局胡牌</h2><fieldset class="question"><legend>本局庄家</legend><div class="choices" id="dealer"></div></fieldset><fieldset class="question"><legend>胡牌者</legend><div class="choices" id="winner"></div></fieldset><fieldset class="question"><legend>胡牌方式</legend><div class="choices" id="method"></div></fieldset><fieldset class="question" id="discardQuestion" hidden><legend>放炮方</legend><div class="choices" id="discarder"></div></fieldset><div class="question" id="patternQuestion"><div class="question-title">牌型</div><select id="pattern" aria-label="牌型"><option value="1">平胡 · 1子</option><option value="2">小七对 · 2子</option><option value="2">大七对 · 2子</option><option value="2">十三烂 · 2子</option><option value="4">七星十三烂 · 4子</option></select><div class="modifiers" id="modifiers"><label class="modifier" id="jingdiaoChoice"><input type="checkbox" id="jingdiao">精钓 ×2</label><label class="modifier"><input type="checkbox" id="german">德国 ×2＋5</label><label class="modifier" id="allGermanChoice"><input type="checkbox" id="allGerman">德中德 再×2</label></div><div class="muted" id="specialPattern" hidden>天胡 / 地胡固定每家20子，不叠加普通牌型。</div></div></section><section class="card"><h2>各家精分</h2><p class="muted">各家自行算好精的基础子数填入：正精每张算2，副精每张算1。例如两张正精、一张副精，填5。达到5子自动冲关；只有一家有精时自动算霸王精。</p><div class="playergrid" id="players"></div></section><section class="card"><h2>本局结果</h2><div id="error" class="warn" hidden></div><div class="result playergrid" id="results"></div><details class="breakdown" id="breakdown"><summary>展开详情</summary><div id="details"></div></details><button class="primary" id="next">开启下一局</button></section><footer>结果只显示本局子数，不保存历史。</footer></main><script>
const $=id=>document.getElementById(id),ids=[0,1,2,3],names=['东家','南家','西家','北家'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('players').innerHTML=ids.map(i=>`<div class="player"><input class="name" data-name="${i}" maxlength="12" aria-label="玩家${i+1}姓名" value="${names[i]}"><input class="points" data-points="${i}" type="number" min="0" max="24" step="1" inputmode="numeric" aria-label="${names[i]}精分" value="0"><div class="muted">精分（子）</div></div>`).join('');let roundCleared=false;function selected(id){return document.querySelector(`input[name="${id}"]:checked`)?.value}function choices(id,items,defaultValue){let old=selected(id)??(roundCleared?null:defaultValue);$(id).innerHTML=items.map(([value,label])=>`<label class="choice"><input type="radio" name="${id}" value="${value}" ${value===old?'checked':''}><span>${esc(label)}</span></label>`).join('')}function updateOptions(){for(const [id,def] of [['dealer','0'],['winner','1'],['discarder','2']])choices(id,ids.map(i=>[String(i),names[i]]),def)}updateOptions();choices('method',[['self','自摸'],['discard','放炮'],['heaven','天胡'],['earth','地胡']],'self');function calc(){let dealer=+selected('dealer'),winner=+selected('winner'),method=selected('method'),discarder=+selected('discarder'),pattern=+$('pattern').value,jingdiao=$('jingdiao').checked,german=$('german').checked,allGerman=$('allGerman').checked,points=ids.map(i=>{let raw=document.querySelector(`[data-points="${i}"]`).value;return raw===''?NaN:Number(raw)}),errors=[],incomplete=!selected('dealer')||!selected('winner')||!method||(method==='discard'&&!selected('discarder'))||(method!=='heaven'&&method!=='earth'&&$('pattern').selectedIndex<0)||points.some(v=>Number.isNaN(v));if(incomplete)return{net:[0,0,0,0],lines:[],errors:[],incomplete:true};if(points.some(v=>!Number.isInteger(v)||v<0||v>24))errors.push('精分请输入0到24之间的整数');if(method==='discard'&&discarder===winner)errors.push('胡牌者不能点自己的炮');if(allGerman&&!german)errors.push('德中德需同时勾选德国');if(allGerman&&points.some(v=>v>0))errors.push('德中德要求四家精分均为0');if(jingdiao&&method==='discard')errors.push('精钓请按自摸结算');if(method==='heaven'&&winner!==dealer)errors.push('天胡的胡牌者须是庄家');if(method==='earth'&&winner===dealer)errors.push('地胡的胡牌者须是闲家');let net=[0,0,0,0],lines=[];function pay(from,to,n,reason){if(!n)return;net[from]-=n;net[to]+=n;lines.push({from,to,n,reason})}if(!errors.length){for(const i of ids){if(i===winner)continue;let n=method==='heaven'||method==='earth'?(jingdiao?40:20):pattern;if(method!=='heaven'&&method!=='earth'){if(i===dealer||winner===dealer)n*=2;if(method==='self')n*=2;if(method==='discard'&&discarder===i)n*=2;if(jingdiao)n*=2;if(german)n*=allGerman?4:2;if(german&&(method!=='discard'||discarder===i))n+=5}pay(i,winner,n,'胡牌')}const holders=points.filter(v=>v>0).length;for(const i of ids){let v=points[i],mult=v>=5?v-3:1,over=holders===1&&v>0?2:1,n=v*mult*over;for(const j of ids)if(i!==j)pay(j,i,n,'精分'+(mult>1?'·冲关':'')+(over>1?'·霸王精':''))}}return{net,lines,errors,points}}
function syncChoices(){let method=selected('method'),dealer=selected('dealer'),winner=selected('winner');$('discardQuestion').hidden=method!=='discard';$('specialPattern').hidden=method!=='heaven'&&method!=='earth';$('pattern').hidden=method==='heaven'||method==='earth';$('pattern').disabled=method==='heaven'||method==='earth';$('modifiers').hidden=!method||method==='heaven'||method==='earth';$('jingdiaoChoice').hidden=method!=='self';if(method!=='self')$('jingdiao').checked=false;if(method==='heaven'||method==='earth'){$('german').checked=false;$('allGerman').checked=false}let hasJing=[...document.querySelectorAll('.points')].some(el=>Number(el.value)>0);$('allGermanChoice').hidden=hasJing;if(hasJing)$('allGerman').checked=false;if(!$('german').checked)$('allGerman').checked=false;document.querySelectorAll('input[name="winner"]').forEach(el=>{el.disabled=method==='heaven'&&dealer!==undefined&&el.value!==dealer||method==='earth'&&dealer!==undefined&&el.value===dealer});if(method==='heaven'&&dealer!==undefined){let target=document.querySelector(`input[name="winner"][value="${dealer}"]`);target.checked=true;winner=dealer}else if(method==='earth'&&winner===dealer){document.querySelector('input[name="winner"]:checked').checked=false;winner=undefined}document.querySelectorAll('input[name="discarder"]').forEach(el=>el.disabled=method==='discard'&&winner!==undefined&&el.value===winner);if(method==='discard'&&selected('discarder')===winner)document.querySelector('input[name="discarder"]:checked').checked=false}function render(){syncChoices();let r=calc();$('error').hidden=!r.errors.length;$('error').textContent=r.errors.join('；');$('results').innerHTML=ids.map(i=>`<div class="player"><div>${esc(names[i])}</div><div class="score ${r.net[i]<0?'negative':''}">${r.incomplete?'—':(r.net[i]>0?'+':'')+r.net[i]}</div><div class="muted">子</div></div>`).join('');$('details').innerHTML=r.errors.length?'':r.lines.map(x=>`<div class="detail"><span>${esc(names[x.from])} → ${esc(names[x.to])} <span class="muted">${x.reason}</span></span><strong>${x.n}子</strong></div>`).join('');return r}document.querySelectorAll('select,.points,.modifier input').forEach(el=>el.addEventListener('input',()=>{if(el.id==='allGerman'&&el.checked)$('german').checked=true;render()}));document.querySelectorAll('.choices').forEach(el=>el.addEventListener('change',render));document.querySelectorAll('.name').forEach(el=>el.addEventListener('change',()=>{let i=+el.dataset.name;names[i]=el.value.trim()||`玩家${i+1}`;el.value=names[i];document.querySelector(`[data-points="${i}"]`).setAttribute('aria-label',names[i]+'精分');updateOptions();render()}));$('next').onclick=()=>{roundCleared=true;document.querySelectorAll('.choices input').forEach(el=>el.checked=false);$('pattern').selectedIndex=-1;document.querySelectorAll('.modifier input').forEach(el=>el.checked=false);document.querySelectorAll('.points').forEach(el=>el.value='0');$('breakdown').open=false;render();window.scrollTo({top:0,behavior:'smooth'})};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
